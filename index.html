body,.wrap,.card,.body{overflow-anchor:none}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 64px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:"Instrument Serif",Georgia,serif;font-size:29px;line-height:1.1;letter-spacing:.2px}
.brand em{font-style:italic;color:var(--accent)}
.headright{display:flex;align-items:center;gap:8px}
.sub{font-size:11.5px;color:var(--ink-3);letter-spacing:.09em;text-transform:uppercase;font-weight:600;
  max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;flex:none}
.lang button{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.06em;
  padding:4px 9px;border:none;background:transparent;color:var(--ink-3);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--accent);color:#fff}
.helpbtn{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;width:24px;height:24px;
  border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);cursor:pointer;
  line-height:1;flex:none}
.helpbtn:hover{border-color:var(--accent);color:var(--accent)}
.pick{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:8px 12px}
.pick label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;flex:none}
.pick select{flex:1;min-width:0;font-family:inherit;font-size:14px;color:var(--ink);background:transparent;
  border:none;outline:none;cursor:pointer;padding:3px 0;text-overflow:ellipsis}
.pick select:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:5px}
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:9px 11px;display:flex;flex-direction:column;gap:1px}
.stat b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:18px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:10px;color:var(--ink-3);letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.stat.due b{color:var(--accent)} .stat.ok b{color:var(--ok)} .stat.miss b{color:var(--miss)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.meta{display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--line);
  background:var(--sunk);flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;
  border-radius:999px;background:var(--accent-wash);color:var(--accent-ink);
  border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.tag.plain{background:transparent;color:var(--ink-3);border-color:var(--line-2);text-transform:none;letter-spacing:0}
.nav{font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1;background:transparent;
  border:1px solid var(--line-2);color:var(--ink-3);border-radius:7px;padding:4px 8px;cursor:pointer;flex:none}
.nav:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.nav:disabled{opacity:.32;cursor:default}
.card.reviewing{border-color:var(--near)}
.card.reviewing .meta{background:var(--near-wash)}
.star{font-size:15px;line-height:1;background:transparent;border:1px solid var(--line-2);color:var(--ink-3);
  border-radius:7px;padding:3px 7px;cursor:pointer;flex:none}
.star:hover{border-color:var(--accent);color:var(--accent)}
.star[aria-pressed=true]{color:var(--star);border-color:var(--star);background:color-mix(in srgb,var(--star) 12%,transparent)}
.meta .grow{margin-left:auto;font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums}
.body{padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px}
.dirtog{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600;cursor:pointer;background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin-bottom:9px}
.dirtog:hover{border-color:var(--accent);color:var(--accent)}
.dirtog .swap{font-size:12px;opacity:.8}
.prompt{font-family:"Instrument Serif",Georgia,serif;font-size:32px;line-height:1.18;text-wrap:balance;letter-spacing:.1px}
.hint{font-size:12.5px;color:var(--ink-3);font-style:italic;margin-top:-6px}
input[type=text]{width:100%;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:17px;padding:11px 13px;
  border:1.5px solid var(--line-2);border-radius:var(--r);background:var(--paper);color:var(--ink);outline:none}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
input[type=text][readonly]{opacity:.7}
.accents{display:flex;flex-wrap:wrap;gap:5px}
.accents button{font-family:"IBM Plex Mono",monospace;font-size:14px;min-width:32px;padding:5px 0;
  border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink-2);cursor:pointer}
.accents button:hover{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.btn{font-family:inherit;font-size:14px;font-weight:600;padding:10px 17px;border-radius:var(--r);
  border:1px solid transparent;cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{background:var(--accent-ink)}
.btn:disabled{background:var(--accent);opacity:1;cursor:default}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);
  border-radius:5px;padding:1px 5px}
.verdict{border-radius:var(--r);padding:13px 15px;display:flex;flex-direction:column;gap:6px;border-left:3px solid}
.verdict.ok{background:var(--ok-wash);border-color:var(--ok)}
.verdict.near{background:var(--near-wash);border-color:var(--near)}
.verdict.miss{background:var(--miss-wash);border-color:var(--miss)}
.verdict .lab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.verdict.ok .lab{color:var(--ok)} .verdict.near .lab{color:var(--near)} .verdict.miss .lab{color:var(--miss)}
.verdict .ans{font-family:"Instrument Serif",Georgia,serif;font-size:25px;line-height:1.2}
.verdict .note{font-size:13px;color:var(--ink-2)}
.verdict .note s{color:var(--ink-3)}
details.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.panel>summary{cursor:pointer;padding:11px 15px;font-size:12.5px;font-weight:600;color:var(--ink-2);
  list-style:none;display:flex;align-items:center;gap:8px}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"▾";margin-left:auto;color:var(--ink-3);font-size:11px}
details.panel[open]>summary::after{content:"▴"}
.panel-in{padding:0 15px 15px;display:flex;flex-direction:column;gap:13px;border-top:1px solid var(--line)}
.grp{display:flex;flex-direction:column;gap:6px}
.grp>span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:inherit;font-size:12.5px;padding:6px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);display:flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip small{font-family:"IBM Plex Mono",monospace;font-size:10.5px;opacity:.72}
#dbg{font-family:"IBM Plex Mono",monospace;font-size:10.5px;line-height:1.5;white-space:pre-wrap;
  background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
  color:var(--ink-2);margin:0;overflow-x:auto}
.foot{font-size:11.5px;color:var(--ink-3);text-align:center;line-height:1.7}
.foot b{color:var(--ink-2);font-weight:600}
.sync{display:inline-flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.dot.on{background:var(--ok)}
.done{text-align:center;padding:34px 20px;display:flex;flex-direction:column;gap:9px}
.done h2{font-family:"Instrument Serif",Georgia,serif;font-size:27px;font-weight:400;margin:0}
.done p{margin:0;color:var(--ink-2);font-size:14px}
dialog#help{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);
  padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog#help::backdrop{background:rgba(10,14,20,.55)}
.help-h{display:flex;align-items:baseline;gap:10px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.help-h h2{margin:0;font-family:"Instrument Serif",Georgia,serif;font-size:23px;font-weight:400}
.help-h button{margin-left:auto;font-family:inherit;font-size:13px;padding:5px 12px;border-radius:8px;
  border:1px solid var(--line-2);background:transparent;color:var(--ink-2);cursor:pointer}
.help-h button:hover{border-color:var(--accent);color:var(--accent)}
.help-b{padding:16px 20px 20px;display:flex;flex-direction:column;gap:16px;max-height:70vh;overflow-y:auto}
.help-b h3{margin:0 0 6px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.help-b p{margin:0 0 6px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.help-b dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline;font-size:13.5px}
.help-b dt{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink);white-space:nowrap;
  border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;justify-self:start}
.help-b dd{margin:0;color:var(--ink-2)}
.help-b .verd{display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.help-b .verd i{font-style:normal;font-weight:700;margin-right:6px}
.help-b .verd .v1{color:var(--ok)} .help-b .verd .v2{color:var(--near)} .help-b .verd .v3{color:var(--miss)}
@media (max-width:560px){.rail{grid-template-columns:repeat(2,1fr)}.prompt{font-size:27px}.brand{font-size:25px}.sub{max-width:120px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="head">
    <div class="brand">Mon <em>lexique</em></div>
    <div class="headright">
      <div class="sub" id="deckLabel"></div>

        <button type="button" data-lang="fr" aria-pressed="true">FR</button>

    <div class="stat miss"><b id="sMiss">0</b><span id="lMiss"></span></div>
    <div class="stat"><b id="sSeen">0</b><span id="lSeen"></span></div>

  <div class="card">

      <button class="nav" id="fwd" type="button">▶</button>
      <button class="star" id="star" type="button" aria-pressed="false">★</button>

        <button class="btn" id="go"></button>

    </div>
  </div>

  <dialog id="help">

    <div class="help-b" id="helpBody"></div>
  </dialog>

  <details class="panel">
    <summary id="panelTitle"></summary>
    <div class="panel-in">
      <div class="grp"><span id="lblDir"></span>
        <div class="chips" id="dirChips">
          <button class="chip" data-dir="ef" aria-pressed="true"></button>
          <button class="chip" data-dir="fe" aria-pressed="false"></button>
        </div>
      </div>
      <div class="grp"><span id="lblSession"></span>
        <div class="chips">
          <button class="chip" id="resetSession"></button>
          <button class="chip" id="cramMode" aria-pressed="false"></button>
        </div>
      </div>
    </div>
  </details>

  <pre id="dbg" hidden></pre>

  <div class="foot">
    <span class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt"></span></span><br>
    <span id="footTip"></span>
  </div>
</div>

let lang = "fr";
const T = () => I18N[lang];

/* ---------- integrity ---------- */
function hashStr(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h*33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); }
function integrity(){
  const canon = CARDS.map(c => c.fr + "|" + c.en).join("\n");
  return {ok: hashStr(canon) === DATA_HASH && CARDS.length === DATA_COUNT, n: CARDS.length};
}

/* ---------------- cards ---------------- */
const cid = c => { let h = 5381; const s = c.fr + "|" + c.en;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); };
CARDS.forEach(c => c.id = cid(c));

const strip = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
const ART = /^(le |la |les |l'|l’|un |une |des |du |de la |to |a |an |the )/;
function norm(s, deep){
  let t = (s || "").toLowerCase().replace(/[’]/g, "'").trim();
  t = t.replace(/[.,;!?"«»…]/g, " ").replace(/\s+/g, " ").trim();
  if (deep){ t = strip(t); t = t.replace(ART, "").trim(); }
  return t;
}
function lev(a, b){
  const m = a.length, n = b.length;
  if (!m || !n) return Math.max(m, n);
  let prev = Array.from({length: n + 1}, (_, i) => i), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++){ cur[0] = i;
    for (let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    [prev, cur] = [cur, prev]; }
  return prev[n];
}
function judge(input, targets){
  const raw = norm(input, false);
  if (!raw) return {v: "miss"};
  const bare = t => t.replace(ART, "").trim();
  for (const t of targets) if (raw === norm(t, false)) return {v: "ok"};
  // diacritics differ, article agrees
  for (const t of targets) if (strip(raw) === strip(norm(t, false))) return {v: "near", why: "accent"};
  // article differs, diacritics agree
  for (const t of targets) if (bare(raw) === bare(norm(t, false))) return {v: "near", why: "article"};
  // both differ
  for (const t of targets) if (norm(raw, true) === norm(t, true)) return {v: "near", why: "both"};
  for (const t of targets){
    const a = norm(raw, true), b = norm(t, true);
    if (lev(a, b) <= Math.max(1, Math.floor(b.length / 6))) return {v: "near", why: "typo"};
  }
  return {v: "miss"};
}

/* ---------------- state ---------------- */
let stars = {add: {}, rm: {}};
const WEAK_LAPSES = 3;
function inPriority(c){
  if (stars.rm[c.id]) return false;
  if (stars.add[c.id]) return true;
  return c.d === "priority";
}
function isWeak(c){ const p = prog[c.id]; return !!p && (p.l || 0) >= WEAK_LAPSES; }
let prog = {}, sess = {ok:0, miss:0, seen:0}, queue = [], cur = null, awaiting = false;
let db = null, dirty = new Set(), saveTimer = null, starTimer = null, shownAt = 0;
let hist = [], hpos = -1;            // cards already answered this session; hpos = -1 means "live card"
const HIST_MAX = 40;
let state = {deck: DEFAULT_DECK, dir: "ef", cram: false};
const DAY = 864e5;
const $ = id => document.getElementById(id);

const DECKS = [
  {k:"priority", lk:"dPriority", f: c => inPriority(c)},
  {k:"weak",     lk:"dWeak", nk:"dWeakNote", f: c => isWeak(c)},
  {k:"toolkit",  lk:"dToolkit", nk:"nToolkit", f: c => c.d === "toolkit"},
  {k:"fauxamis", lk:"dFaux", f: c => c.d === "fauxamis"},
  {k:"s4",  lk:"dS4", nk:"nS4", f: c => c.s === 4},
  {k:"s3",  lk:"dS3", nk:"nS3", f: c => c.s === 3},
  {k:"s2",  lk:"dS2", nk:"nS2", f: c => c.s === 2},
  {k:"s1",  lk:"dS1", nk:"nS1", f: c => c.s === 1},
  {k:"idx", lk:"dIdx", f: c => c.d === "cspsidx"},
  {k:"all", lk:"dAll", f: () => true},

function topicLabel(n){ const t = TOPICS[n]; return t ? (lang === "fr" ? t.fr : t.en) : "objectif " + n; }
function deckOf(k){
  const m = /^o(\d+)$/.exec(k);
  if (m){ const n = +m[1]; return {k, label: n + " · " + topicLabel(n), f: c => c.o === n, topic: n}; }
  const d = DECKS.find(x => x.k === k);
  return d ? {...d, label: T()[d.lk], note: d.nk ? T()[d.nk] : ""} : DECKS[0];
}
const poolOf = k => CARDS.filter(deckOf(k).f);
const chunkOf = c => c.d === "csps" ? "csps" + c.s : c.d;
const isDue = c => { const p = prog[c.id]; return !p || p.d <= Date.now(); };

function buildQueue(){
  const pool = poolOf(state.deck);
  const list = state.cram ? pool.slice() : pool.filter(isDue);
  for (let i = list.length - 1; i > 0; i--){ const j = (Math.random()*(i+1))|0; [list[i],list[j]] = [list[j],list[i]]; }
  list.sort((a,b) => (prog[a.id]?1:0) - (prog[b.id]?1:0));
  queue = list;
}
function schedule(c, v){
  const p = prog[c.id] || {i:0, e:2.5, r:0, l:0};
  if (v === "miss"){ p.r=0; p.l=(p.l||0)+1; p.i=0; p.e=Math.max(1.3,p.e-0.2); p.d=Date.now()+6e4; }
  else if (v === "near"){ p.e=Math.max(1.3,p.e-0.05); p.i=p.r===0?1:Math.max(1,Math.round(p.i*1.25)); p.r=(p.r||0)+1; p.d=Date.now()+p.i*DAY; }
  else { p.r=(p.r||0)+1; p.i=p.r===1?1:p.r===2?3:Math.max(1,Math.round((p.i||1)*p.e)); p.e=Math.min(2.8,p.e+0.08); p.d=Date.now()+p.i*DAY; }
  prog[c.id] = p; dirty.add(chunkOf(c)); save();
}
function nextLabel(c){
  const p = prog[c.id];
  if (!p) return T().schedNew;
  if (p.i === 0) return T().schedSoon;
  return T().schedIn(p.i);
}

/* ---------------- persistence ---------------- */
const LS = "lexique-drill-v1", LSS = "lexique-stars-v1", LSL = "lexique-lang-v1";
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(prog)); } catch(e){} }
function saveStars(){
  try { localStorage.setItem(LSS, JSON.stringify(stars)); } catch(e){}
  if (!db) return;
  clearTimeout(starTimer);
  starTimer = setTimeout(() => { db.doc("progress/stars").set(stars).catch(() => {}); }, 900);
}
function save(){
  saveLocal();
  if (!db) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const chunks = [...dirty]; dirty.clear();
    for (const ch of chunks){
      const rows = {};
      for (const c of CARDS) if (chunkOf(c) === ch && prog[c.id]) rows[c.id] = prog[c.id];
      try { await db.doc("progress/" + ch).set({rows}); } catch(e){ dirty.add(ch); }
    }
  }, 1200);
}
async function initDb(){
  try { prog = JSON.parse(localStorage.getItem(LS)) || {}; } catch(e){}
  try { stars = JSON.parse(localStorage.getItem(LSS)) || stars; } catch(e){}
  applyLang(); buildQueue(); next(); render();
  let d = null;
  try { if (typeof claude !== "undefined" && claude.use) d = await claude.use("db"); } catch(e){}
  if (!d){ $("syncDot").className = "dot"; $("syncTxt").textContent = T().syncOff; return; }
  db = d;
  try {
    for (const ch of [...new Set(CARDS.map(chunkOf))]){
      const snap = await db.doc("progress/" + ch).get();
      const rows = snap && snap.data && snap.data.rows;
      if (rows) for (const k in rows) if (!prog[k] || (rows[k].d||0) > (prog[k].d||0)) prog[k] = rows[k];
    }
    const sd = await db.doc("progress/stars").get();
    if (sd && sd.data && (sd.data.add || sd.data.rm)) stars = {add: sd.data.add||{}, rm: sd.data.rm||{}};
    saveLocal();
    $("syncDot").className = "dot on"; $("syncTxt").textContent = T().syncOn;
    renderChips(); buildQueue(); next(); render();
  } catch(e){ $("syncDot").className = "dot"; $("syncTxt").textContent = T().syncOff; }
}

/* ---------------- render ---------------- */
const esc = s => (s||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function render(){
  const pool = poolOf(state.deck);
  $("sDue").textContent = state.cram ? pool.length : pool.filter(isDue).length;
  $("sOk").textContent = sess.ok; $("sMiss").textContent = sess.miss; $("sSeen").textContent = sess.seen;
  const d = deckOf(state.deck);
  $("deckLabel").textContent = d.label;
  $("deckLabel").title = d.topic && TOPICS[d.topic] ? (lang === "fr" ? TOPICS[d.topic].en : TOPICS[d.topic].fr) : "";
  $("dirText").textContent = state.dir === "ef" ? T().dirEF : T().dirFE;
}
function renderChips(){
  const sel = $("deckSelect"), t = T();
  const opt = (k,l,n) => `<option value="${k}"${k===state.deck?" selected":""}>${esc(l)} · ${n}</option>`;
  const grp = (n,i) => i ? `<optgroup label="${esc(n)}">${i}</optgroup>` : "";
  const nums = Object.keys(TOPICS).map(Number);
  let h = "";
  h += grp(t.gMine, ["priority","weak","toolkit","fauxamis"].filter(k => k !== "toolkit" || poolOf("toolkit").length).map(k => opt(k, deckOf(k).label, poolOf(k).length)).join(""));
  h += grp(t.gA, nums.filter(n=>n<=32).sort((a,b)=>a-b).map(n => opt("o"+n, n+" · "+topicLabel(n), CARDS.filter(c=>c.o===n).length)).join(""));
  h += grp(t.gB, nums.filter(n=>n>=33).sort((a,b)=>a-b).map(n => opt("o"+n, n+" · "+topicLabel(n), CARDS.filter(c=>c.o===n).length)).join(""));
  h += grp(t.gSets, ["s4","s3","s2","s1","idx","all"].map(k => { const d = deckOf(k);
    return opt(k, d.label + (d.note ? " — " + d.note : ""), poolOf(k).length); }).join(""));
  sel.innerHTML = h;
  sel.onchange = () => { state.deck = sel.value; buildQueue(); next(); render(); };
}
function paintStar(){
  if (!cur) return;
  const on = inPriority(cur);

}
function next(){

  $("go").textContent = T().check;
  if (!queue.length) buildQueue();
  cur = queue.shift() || null;
  if (!cur){
    const bare = state.deck === "priority" && poolOf("priority").length === 0;
    $("cardBody").innerHTML = `<div class="done"><h2>${esc(bare ? T().emptyPH : T().doneH)}</h2>
      <p>${esc(bare ? T().emptyPP : T().doneP)}</p></div>`;
    return;
  }

  // a hint starting with ≠ names the WRONG form — showing it first would prime the error
  const h = (state.dir === "ef" && cur.h && !cur.h.startsWith("≠")) ? cur.h : "";
  $("hint").textContent = h; $("hint").hidden = !h;
  $("tagDeck").textContent = deckOf(state.deck).label;
  const o = cur.o ? cur.o + " · " + topicLabel(cur.o) : "";
  $("tagObj").textContent = o.length > 46 ? o.slice(0,44) + "…" : o;
  $("tagObj").hidden = !o;
  $("tagSched").textContent = nextLabel(cur);

function check(giveUp){

  $("tagSched").textContent = nextLabel(cur);
  shownAt = Date.now();
  if (!("ontouchstart" in window)) $("answer").blur();
  // A disabled form control is not a click target — no event of any origin reaches it.
  // This is the only guard that does not depend on guessing how iOS synthesises taps.
  $("go").disabled = true;
  clearTimeout(reopenTimer);
  reopenTimer = setTimeout(() => { $("go").disabled = false; dbg("button re-enabled"); }, READ_WINDOW);
  $("go").textContent = t.nextBtn;
  render();
}

/* ---------------- language ---------------- */
function applyLang(){
  const t = T();
  document.documentElement.lang = lang;
  $("pickLabel").textContent = t.pick;
  $("lDue").textContent = t.due; $("lOk").textContent = t.ok; $("lMiss").textContent = t.miss; $("lSeen").textContent = t.seen;
  $("answer").placeholder = t.placeholder;
  $("skip").textContent = t.dunno; $("kbdEnter").textContent = t.enter;
  $("go").textContent = awaiting ? t.nextBtn : t.check;
  $("helpBtn").setAttribute("aria-label", t.close);
  $("helpClose").textContent = t.close;
  $("helpBody").innerHTML = t.help;
  const ig = integrity(), fr = lang === "fr";
  const el = $("intg");
  if (el){
    el.innerHTML = ig.ok
      ? `<span style="color:var(--ok)">✓</span> ` + (fr
          ? `<b>Intégrité vérifiée</b> — ${ig.n} cartes, conformes à la version publiée.`
          : `<b>Integrity verified</b> — ${ig.n} cards, matching the published build.`)
      : `<span style="color:var(--near)">⚠</span> ` + (fr
          ? `<b>Contenu modifié</b> — ${ig.n} cartes; ce fichier diffère de la version publiée. Ce n'est pas forcément un problème, mais ce n'est pas la copie d'origine.`
          : `<b>Content modified</b> — ${ig.n} cards; this file differs from the published build. Not necessarily a problem, but it is not the original copy.`);
    el.style.fontSize = "13px"; el.style.color = "var(--ink-2)";
  }
  const cel = $("canon");
  if (cel){
    const bits = [];
    if (SOURCE && SOURCE.indexOf("://") > 0)
      bits.push(`<a href="${SOURCE}" style="color:var(--accent)">` +
        (fr ? "Code source, licence et corrections" : "Source code, licence and corrections") + `</a>`);
    if (CANONICAL && CANONICAL.indexOf("://") > 0)
      bits.push(`<a href="${CANONICAL}" style="color:var(--accent)">` +
        (fr ? "Copie de référence" : "Canonical copy") + `</a>`);
    cel.innerHTML = bits.length
      ? bits.join(" &nbsp;·&nbsp; ") + "<br><span style=\"opacity:.7\">" +
        (fr ? "Une erreur de traduction ? Ouvrez un « issue » — c'est le plus rapide."
            : "Spotted a wrong translation? Open an issue — that's the fastest route.") + "</span>"
      : (fr ? "<i>Copie de référence : à définir.</i>" : "<i>Canonical copy: not yet set.</i>");
    cel.style.fontSize = "12.5px"; cel.style.lineHeight = "1.7";
  }
  $("panelTitle").textContent = t.panel;
  $("lblDir").textContent = t.dirLbl; $("lblSession").textContent = t.sessLbl;
  $("resetSession").textContent = t.reset;
  $("cramMode").innerHTML = esc(t.cram) + ` <small>${esc(t.cramNote)}</small>`;
  const dc = $("dirChips").querySelectorAll("[data-dir]");
  dc[0].innerHTML = esc(t.dirEF) + ` <small>${esc(t.prod)}</small>`;
  dc[1].innerHTML = esc(t.dirFE) + ` <small>${esc(t.comp)}</small>`;
  $("footTip").innerHTML = t.foot + `<br><span style="opacity:.75">Mon lexique v${VERSION} · ${DATA_COUNT} ${lang === "fr" ? "cartes" : "cards"}</span>`;
  $("syncTxt").textContent = db ? t.syncOn : t.syncOff;
  $("lang").querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  renderChips(); render();
  if (cur) { $("tagDeck").textContent = deckOf(state.deck).label;
    const o = cur.o ? cur.o + " · " + topicLabel(cur.o) : "";
    $("tagObj").textContent = o.length > 46 ? o.slice(0,44) + "…" : o; $("tagObj").hidden = !o;
    $("tagSched").textContent = nextLabel(cur); paintStar(); }
}
function setLang(l){ lang = l; try { localStorage.setItem(LSL, l); } catch(e){} applyLang(); }

function paintNav(){
  const atLive = hpos === -1;
  $("back").disabled = hist.length === 0 || hpos === 0;
  $("fwd").disabled  = atLive;
  $("back").title = T().back; $("fwd").title = T().fwd;
}
function showReview(){
  const h = hist[hpos], t = T(), c = h.card;
  document.querySelector(".card").classList.add("reviewing");
  $("prompt").textContent = state.dir === "ef" ? c.en : c.fr;
  $("hint").textContent = c.h || ""; $("hint").hidden = !c.h;
  $("answer").value = h.typed || ""; $("answer").readOnly = true;
  $("accents").hidden = true;
  $("tagDeck").textContent = t.reviewing;
  const o = c.o ? c.o + " · " + topicLabel(c.o) : "";
  $("tagObj").textContent = o.length > 46 ? o.slice(0, 44) + "…" : o; $("tagObj").hidden = !o;
  $("tagSched").textContent = nextLabel(c);
  const lab = h.v === "ok" ? t.vOk : h.v === "miss" ? t.vMiss
    : {accent: t.vAccent, article: t.vArticle, both: t.vBoth, typo: t.vTypo}[h.why] || t.vTypo;
  $("verdictSlot").innerHTML = `<div class="verdict ${h.v}"><div class="lab">${esc(lab)}</div>
    <div class="ans">${esc(state.dir === "ef" ? c.fr : c.en)}</div></div>`;
  $("go").textContent = t.nextBtn;
  paintNav();
}
function goBack(){
  if (!hist.length) return;
  if (hpos === -1) snapLive();
  hpos = hpos === -1 ? hist.length - 1 : Math.max(0, hpos - 1);
  showReview();
}
function goFwd(){
  if (hpos === -1) return;
  if (hpos >= hist.length - 1){          // back to the live card
    hpos = -1;
    document.querySelector(".card").classList.remove("reviewing");
    restoreLive();
    paintNav(); render(); return;
  }
  hpos++; showReview();
}
let lastRes = null, liveSnap = null;
const LIVE_KEYS = ["prompt","verdictSlot","answer","hint","go","tagDeck","tagObj","tagSched","accents"];
function snapLive(){
  liveSnap = {
    prompt: $("prompt").textContent, verdict: $("verdictSlot").innerHTML,
    answer: $("answer").value, answerOff: $("answer").readOnly,
    hint: $("hint").textContent, hintOff: $("hint").hidden,
    go: $("go").textContent, deck: $("tagDeck").textContent,
    obj: $("tagObj").textContent, objOff: $("tagObj").hidden,
    sched: $("tagSched").textContent, accOff: $("accents").hidden
  };
}
function restoreLive(){
  if (!liveSnap){ next(); return; }
  const v = liveSnap;
  $("prompt").textContent = v.prompt; $("verdictSlot").innerHTML = v.verdict;
  $("answer").value = v.answer; $("answer").readOnly = v.answerOff;
  $("hint").textContent = v.hint; $("hint").hidden = v.hintOff;
  $("go").textContent = v.go; $("tagDeck").textContent = v.deck;
  $("tagObj").textContent = v.obj; $("tagObj").hidden = v.objOff;
  $("tagSched").textContent = v.sched; $("accents").hidden = v.accOff;
  paintStar();
}

/* ---- diagnostics: tap the "cards seen" number five times to toggle ---- */
let DBG = false, dbgLines = [];
function dbg(msg){
  if (!DBG) return;
  const t = (Date.now() % 100000) / 1000;
  dbgLines.unshift(t.toFixed(2) + "  " + msg);
  dbgLines = dbgLines.slice(0, 14);
  const el = $("dbg"); if (el) el.textContent = dbgLines.join("\n");
}
(function(){
  let taps = 0, last = 0;
  $("sSeen").addEventListener("click", () => {
    const now = Date.now();
    taps = (now - last < 800) ? taps + 1 : 1; last = now;
    if (taps >= 5){
      taps = 0; DBG = !DBG;
      $("dbg").hidden = !DBG;
      dbgLines = [DBG ? (lang === "fr"
        ? "Journal de diagnostic ACTIVÉ. Reproduisez le problème, puis faites une capture d'écran."
        : "Diagnostic log ENABLED. Reproduce the problem, then take a screenshot.")
        : ""];
      $("dbg").textContent = dbgLines[0];
    }
  });
  ["pointerdown","pointerup","click","touchstart","touchend"].forEach(ev =>
    $("go").addEventListener(ev, e =>
      dbg(ev + (e.pointerType ? "/" + e.pointerType : "") +
          "  awaiting=" + (awaiting ? 1 : 0) + " dis=" + ($("go").disabled ? 1 : 0)), true));
})();

/* ---------------- events ---------------- */
"é è ê ë à â ä î ï ô ö û ù ü ç œ".split(" ").forEach(ch => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = ch;
  b.onclick = () => { const i = $("answer"); if (i.disabled) return;
    const s = i.selectionStart, e = i.selectionEnd;
    i.value = i.value.slice(0,s) + ch + i.value.slice(e);
    i.selectionStart = i.selectionEnd = s + ch.length; i.focus(); };
  $("accents").appendChild(b);
});
function setDir(d){
  state.dir = d;
  $("dirChips").querySelectorAll("[data-dir]").forEach(x => x.setAttribute("aria-pressed", x.dataset.dir === d));
  buildQueue(); next(); render();
}
function toggleStar(){
  if (!cur) return;
  const on = inPriority(cur), native = cur.d === "priority";
  delete stars.add[cur.id]; delete stars.rm[cur.id];
  if (on){ if (native) stars.rm[cur.id] = 1; } else { if (!native) stars.add[cur.id] = 1; }
  paintStar(); saveStars(); render(); renderChips();
}
/* iOS dismisses the keyboard when the input is disabled; the reflow that follows can make
   Safari dispatch a SECOND, synthesized click on the button — which skipped straight past the
   verdict. A timing guard cannot catch it reliably (the ghost arrives after the keyboard
   animation). So an advance requires a real gesture: a pointerdown on the button, or a keypress.
   Synthesized clicks carry no pointerdown, so they are ignored. */
let armedAt = 0, reopenTimer = null;
const READ_WINDOW = 350;   // brief, only to absorb an accidental double-tap
$("go").addEventListener("pointerdown", () => { armedAt = Date.now(); });
$("go").onclick = () => {
  if (hpos !== -1){ goFwd(); return; }            // reviewing: step forward instead
  if (awaiting){
    // Only a gesture that BEGAN AFTER the verdict appeared may advance. This rejects
    // ghost clicks and any tap whose click was swallowed by the keyboard and delivered late.
    if (armedAt <= shownAt){ dbg("BLOCKED: gesture predates verdict"); return; }
    dbg("ADVANCE"); armedAt = 0; next(); render();
  } else {
    dbg("CHECK"); armedAt = 0; check(false);
  }
};
$("skip").onclick = () => { if (hpos === -1 && !awaiting) check(true); };
$("back").onclick = goBack;
$("fwd").onclick  = goFwd;
$("star").onclick = toggleStar;
$("dirLabel").onclick = () => setDir(state.dir === "ef" ? "fe" : "ef");
$("helpBtn").onclick = () => $("help").showModal();
$("helpClose").onclick = () => $("help").close();
$("help").addEventListener("click", e => { if (e.target === $("help")) $("help").close(); });
$("lang").querySelectorAll("[data-lang]").forEach(b => b.onclick = () => setLang(b.dataset.lang));
$("answer").addEventListener("keydown", e => { if (e.key === "Enter" && !e.repeat){ e.preventDefault(); armedAt = Date.now(); $("go").click(); } });
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft"  && document.activeElement !== $("answer")){ e.preventDefault(); goBack(); return; }
  if (e.key === "ArrowRight" && document.activeElement !== $("answer")){ e.preventDefault(); goFwd(); return; }
  if (e.key === "Enter" && !e.repeat && awaiting && document.activeElement !== $("answer")){ armedAt = Date.now(); $("go").click(); }
  if (e.key === "Tab" && !e.shiftKey && document.activeElement === $("answer") && !$("answer").value){
    e.preventDefault(); setDir(state.dir === "ef" ? "fe" : "ef"); }
  if ((e.key === "s" || e.key === "S") && document.activeElement !== $("answer") && !$("help").open){
    e.preventDefault(); toggleStar(); }
});
$("dirChips").querySelectorAll("[data-dir]").forEach(b => b.onclick = () => setDir(b.dataset.dir));
$("resetSession").onclick = () => { sess = {ok:0, miss:0, seen:0}; render(); };
$("cramMode").onclick = e => { state.cram = !state.cram;
  e.currentTarget.setAttribute("aria-pressed", state.cram); buildQueue(); next(); render(); };

if ("1" === "1" && "serviceWorker" in navigator && location.protocol === "https:")
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

try { const l = localStorage.getItem(LSL); if (l === "en" || l === "fr") lang = l; } catch(e){}
$("syncTxt").textContent = I18N[lang].syncLoad;
initDb();
</script>
